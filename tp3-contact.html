<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="contact.css">
    <title>Contact</title>
</head>

<body>
    <form>
        <fieldset>
            <legend>Contactez-moi</legend>

            <div class="civilite">
                <label>Civilité :</label>

                <label for="r1">Monsieur :</label>
                <input id="r1" type="radio" name="genre" checked>

                <label for="r2">Madame :</label>
                <input id="r2" type="radio" name="genre">

                <label for="r3">Mademoiselle :</label>
                <input id="r3" type="radio" name="genre">
            </div>

            <label for="t1">Nom :</label>
            <input type="text" id="t1" placeholder="votre nom" required>

            <label for="t2" class="prenom">Prenom :</label>
            <input type="text" id="t2" placeholder="votre nom" required>

            <label for="t3">Email :</label>
            <input type="email" id="t3" placeholder="votre email" required>

            <label for="t4">Tel :</label>
            <input type="tel" id="t4" placeholder="votre teléphone" required pattern="9[0-9]{7}">

            <label for="t5">Sujet :</label>
            <input type="text" id="t5" placeholder="votre sujet" required>

            <label for="m">Message :</label>
            <textarea rows="10" cols="40" id="m"></textarea><br>

            <input type="submit" value="Envoyer">
            <input type="reset" value="Annuler">
        </fieldset>
    </form>
</body>

</html>
